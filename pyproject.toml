[project]
name = "query"
version = "0.1.5"
description = "Standalone DolphinDB query DSL and incremental market-data workers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dolphindb>=3.0.4.2",
    "loguru>=0.7.3,<0.8",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=21",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1",
    "tushare>=1.4.29,<2",
]

[project.scripts]
query = "query.manage:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "query"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
